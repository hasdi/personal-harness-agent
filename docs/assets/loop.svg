<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#8a4630"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#15803d"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5b5650"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#faf9f5" stroke="#e6dfd8"/>

  <text x="80" y="58" font-size="26" font-weight="700" fill="#141413">The PHA loop — one message in, one grounded reply out</text>
  <text x="80" y="88" font-size="17" fill="#5b5650">System One guards both ends (triage in, judge out) — the engine loop runs guarded in the middle</text>

  <!-- step 1: input -->
  <rect x="60" y="130" width="200" height="120" rx="14" fill="#ffffff" stroke="#e6dfd8" stroke-width="2"/>
  <text x="160" y="162" font-size="15" font-weight="700" fill="#8a4630" text-anchor="middle">1 · CHAT IN</text>
  <text x="160" y="190" font-size="18" font-weight="600" fill="#141413" text-anchor="middle">Telegram · Discord</text>
  <text x="160" y="212" font-size="18" font-weight="600" fill="#141413" text-anchor="middle">Slack · WebUI</text>
  <text x="160" y="236" font-size="14" fill="#5b5650" text-anchor="middle">run.started → trace</text>

  <line x1="260" y1="190" x2="318" y2="190" stroke="#8a4630" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- step 2: triage -->
  <rect x="324" y="130" width="200" height="120" rx="16" fill="#a9583e"/>
  <text x="424" y="162" font-size="15" font-weight="700" fill="#f5e6dc" text-anchor="middle">2 · TRIAGE</text>
  <text x="424" y="190" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">System One</text>
  <text x="424" y="212" font-size="14" fill="#f5e6dc" text-anchor="middle">intent · urgency · spam</text>
  <text x="424" y="232" font-size="14" fill="#f5e6dc" text-anchor="middle">+ agent hint · ~100 ms</text>

  <line x1="524" y1="190" x2="582" y2="190" stroke="#8a4630" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- step 3: bundle -->
  <rect x="588" y="130" width="200" height="120" rx="14" fill="#ffffff" stroke="#e6dfd8" stroke-width="2"/>
  <text x="688" y="162" font-size="15" font-weight="700" fill="#8a4630" text-anchor="middle">3 · BUNDLE</text>
  <text x="688" y="190" font-size="18" font-weight="600" fill="#141413" text-anchor="middle">session + memory</text>
  <text x="688" y="212" font-size="14" fill="#5b5650" text-anchor="middle">soul · user · skills · MCP</text>
  <text x="688" y="232" font-size="14" fill="#5b5650" text-anchor="middle">permission · effort · preset</text>

  <line x1="788" y1="190" x2="846" y2="190" stroke="#8a4630" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- step 4: engine -->
  <rect x="852" y="130" width="288" height="120" rx="14" fill="#ffffff" stroke="#e6dfd8" stroke-width="2"/>
  <text x="996" y="162" font-size="15" font-weight="700" fill="#8a4630" text-anchor="middle">4 · ENGINE LOOP</text>
  <text x="996" y="190" font-size="18" font-weight="600" fill="#141413" text-anchor="middle">LLM ↔ tools (≤ max turns)</text>
  <text x="996" y="212" font-size="14" fill="#5b5650" text-anchor="middle">permission gate · audit · file diff</text>
  <text x="996" y="232" font-size="14" fill="#5b5650" text-anchor="middle">secret redact · fallback provider</text>

  <!-- return arrow: engine down to judge -->
  <line x1="996" y1="250" x2="996" y2="318" stroke="#8a4630" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- step 5: judge -->
  <rect x="852" y="324" width="288" height="104" rx="16" fill="#a9583e"/>
  <text x="996" y="356" font-size="15" font-weight="700" fill="#f5e6dc" text-anchor="middle">5 · JUDGE</text>
  <text x="996" y="384" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">System One scores reply</text>
  <text x="996" y="406" font-size="14" fill="#f5e6dc" text-anchor="middle">groundedness · metadata only, never blocks</text>

  <line x1="852" y1="376" x2="420" y2="376" stroke="#8a4630" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- step 6: output -->
  <rect x="132" y="324" width="282" height="104" rx="14" fill="#e7f4ec" stroke="#15803d" stroke-width="2"/>
  <text x="273" y="356" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">6 · REPLY OUT</text>
  <text x="273" y="384" font-size="18" font-weight="600" fill="#141413" text-anchor="middle">final → channel + WebUI</text>
  <text x="273" y="406" font-size="14" fill="#116635" text-anchor="middle">snapshot saved · trace/audit complete</text>

  <!-- memory lane -->
  <rect x="60" y="470" width="1080" height="110" rx="12" fill="#f3eee5" stroke="#e6dfd8"/>
  <text x="84" y="502" font-size="16" font-weight="600" fill="#3f3a34">Why this loop is different:</text>
  <text x="84" y="528" font-size="15" fill="#5b5650">cheap local decisions guard both ends of every run — triage routes before the expensive call, judge scores after it.</text>
  <text x="84" y="552" font-size="15" fill="#5b5650">System One disabled, slow, or unsure → silent fallback to the legacy path. Never an error to the user, always a trace.</text>
</svg>
